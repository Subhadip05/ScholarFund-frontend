# 1. HTTP Server - Redirects all unencrypted traffic to HTTPS
server {
    listen 80;
    server_name scholarfund.duckdns.org localhost;

    # Let's Encrypt renewal validation
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Server - Handles SSL, Angular SPA, and API proxying
server {
    listen 443 ssl;
    server_name scholarfund.duckdns.org localhost;

    # SSL Certificate Paths
    ssl_certificate /etc/letsencrypt/live/scholarfund.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scholarfund.duckdns.org/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Angular SPA routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Spring Boot backend API reverse proxy
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Static asset caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
